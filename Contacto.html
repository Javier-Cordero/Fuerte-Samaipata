<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactos</title>
</head>

<body>
    <main>
        <section>
            <h1>Tarifas y reservas</h1>
        </section>

        <section>
            <h2>Tabla de tarifas</h2>
            <table>
                <caption>Tarifas por persona en bolivianos (Bs)</caption>
                <thead>
                    <tr>
                        <th scope="col">Tour</th>
                        <th scope="col">Duración</th>
                        <th scope="col">Adulto</th>
                        <th scope="col">Niño (6-12)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Fuerte de Samaipata</td>
                        <td>4h</td>
                        <td>180</td>
                        <td>100</td>
                    </tr>
                    <tr>
                        <td>Helechos del Amboró</td>
                        <td>6h</td>
                        <td>250</td>
                        <td>150</td>
                    </tr>
                    <tr>
                        <td>Cascadas de Las Cuevas</td>
                        <td>3h</td>
                        <td>120</td>
                        <td>70</td>
                    </tr>
                    <tr>
                        <td>Ruta completa 3 días</td>
                        <td>3 días</td>
                        <td>950</td>
                        <td>600</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section>
            <h2>Reserva tu tour</h2>
            <form action="#" method="post">
                <p><label>Nombre completo: <input type="text" name="usuario" required minlength="3"></label></p>
                <p><label for="email">Correo electrónico:<input type="email" id="email" name="email" required></label>
                </p>
                <p><label for="telefono">Teléfono / WhatsApp:<input type="tel" id="telefono" name="telefono"
                            pattern="[0-9+\s-]{7,15}" required></label></p>
                <p>
                    <label for="tour">Tour de interés:</label>
                    <select id="tour" name="tour" required>
                        <option value="">— Selecciona un tour —</option>
                        <option value="fuerte">Fuerte de Samaipata</option>
                        <option value="amboro">Helechos del Amboró</option>
                        <option value="cascadas">Cascadas de Las Cuevas</option>
                        <option value="ruta">Ruta completa 3 días</option>
                    </select>
                </p>
                <p><label for="fecha">Fecha del tour:<input type="date" id="fecha" name="fecha" required></label></p>
                <p><label for="personas">Número de personas:<input type="number" id="personas" name="personas" min="1"
                            max="20" value="2" required></label></p>
                <p><label for="mensaje">Mensaje (opcional):<textarea id="mensaje" name="mensaje" rows="4"
                            maxlength="300"></textarea></label></p>
                <p>
                    <input type="checkbox" id="acepto" name="acepto" required>
                    <label for="acepto">Acepto ser contactado por WhatsApp o correo.</label>
                </p>
                <p>
                    <button type="submit">Enviar reserva</button>
                </p>
            </form>
        </section>
    </main>

</body>

</html>
